name: Publicar etapa 2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: nexo-documentos-production
  cancel-in-progress: false
jobs:
  publicar:
    if: vars.AZURE_WEBAPP_NAME != '' && vars.AZURE_FUNCTIONAPP_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integracion
      - run: npm run build:todo
        env:
          VITE_API_URL: ''
      - name: Preparar API con frontend y función
        run: |
          npm run paquete:api
          npm run paquete:functions
      - name: Iniciar sesión en Azure mediante OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publicar API y frontend en App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: .paquetes/api
      - name: Publicar Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: .paquetes/functions
